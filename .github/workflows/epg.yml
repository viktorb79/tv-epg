name: Update EPG

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build filtered merged EPG
        run: |
          python3 - <<'PY'
          import gzip
          import urllib.request
          import xml.etree.ElementTree as ET

          SOURCES = [
              "https://epgshare01.online/epgshare01/epg_ripper_SK1.xml.gz",
              "https://epgshare01.online/epgshare01/epg_ripper_CZ1.xml.gz",
              "https://epgshare01.online/epgshare01/epg_ripper_HU1.xml.gz",
          ]
          CHANNELS_FILE = "channels.txt"
          OUTPUT_FILE = "epg.xml.gz"

          allowed = set()
          with open(CHANNELS_FILE, encoding="utf-8") as channels_file:
              for line in channels_file:
                  line = line.strip()
                  if line and not line.startswith("#"):
                      allowed.add(line)

          root = ET.Element(
              "tv",
              {
                  "generator-info-name": "tv-epg filtered merge",
              },
          )
          seen_channels = set()
          seen_programmes = set()

          for url in SOURCES:
              request = urllib.request.Request(
                  url, headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  source = ET.fromstring(gzip.decompress(response.read()))

              for channel in source.findall("channel"):
                  channel_id = channel.get("id")
                  if channel_id in allowed and channel_id not in seen_channels:
                      seen_channels.add(channel_id)
                      root.append(channel)

              for programme in source.findall("programme"):
                  channel_id = programme.get("channel")
                  if channel_id not in allowed:
                      continue
                  key = (
                      channel_id,
                      programme.get("start"),
                      programme.get("stop"),
                  )
                  if key in seen_programmes:
                      continue
                  seen_programmes.add(key)
                  root.append(programme)

          if not seen_channels:
              raise SystemExit(
                  "No matching channels found; refusing to write an empty EPG"
              )

          with open(OUTPUT_FILE, "wb") as file_handle:
              with gzip.GzipFile(
                  fileobj=file_handle, mode="wb", mtime=0
              ) as gzip_file:
                  gzip_file.write(
                      ET.tostring(
                          root, encoding="utf-8", xml_declaration=True
                      )
                  )
          PY

      - name: Commit and push merged EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml.gz
          if git diff --cached --quiet; then
            echo "No EPG changes"
            exit 0
          fi
          git commit -m "Update EPG"
          git push
